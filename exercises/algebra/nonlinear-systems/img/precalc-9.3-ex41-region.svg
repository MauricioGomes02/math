<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="420" height="460" font-family="sans-serif" font-size="13">
  <!-- 1 unit = 50 px, origin at (240, 110) -->
  <rect width="420" height="460" fill="#ffffff"/>

  <!-- grid -->
  <g stroke="#e6e6e6" stroke-width="1">
    <path d="M40 0V460M90 0V460M140 0V460M190 0V460M290 0V460M340 0V460M390 0V460"/>
    <path d="M0 10H420M0 60H420M0 160H420M0 210H420M0 260H420M0 310H420M0 360H420M0 410H420"/>
  </g>

  <!-- solution region: below the parabola and above the line -->
  <polygon points="119.3,351.4 127.5,313.1 140,260 152.5,213.1 165,172.5 177.5,138.1 190,110 202.5,88.1 215,72.5 227.5,63.1 240,60 252.5,63.1 260.7,68.6" fill="#2e9e5b" fill-opacity="0.25"/>

  <!-- axes -->
  <g stroke="#333333" stroke-width="1.5">
    <line x1="10" y1="110" x2="410" y2="110"/>
    <line x1="240" y1="455" x2="240" y2="8"/>
  </g>
  <polygon points="414,110 406,106 406,114" fill="#333333"/>
  <polygon points="240,4 236,12 244,12" fill="#333333"/>
  <text x="402" y="100" fill="#333333">x</text>
  <text x="248" y="16" fill="#333333">y</text>
  <text x="226" y="126" fill="#333333">0</text>

  <!-- tick labels -->
  <g fill="#777777" font-size="11">
    <text x="286" y="124">1</text>
    <text x="180" y="124">−1</text>
    <text x="130" y="124">−2</text>
    <text x="246" y="64">1</text>
    <text x="246" y="214">−2</text>
    <text x="246" y="314">−4</text>
    <text x="246" y="414">−6</text>
  </g>

  <!-- boundary parabola y = 1 - x^2 (dashed: strict inequality) -->
  <polyline points="97.5,466 115,372.5 127.5,313.1 140,260 152.5,213.1 165,172.5 177.5,138.1 190,110 202.5,88.1 215,72.5 227.5,63.1 240,60 252.5,63.1 265,72.5 277.5,88.1 290,110 302.5,138.1 315,172.5 327.5,213.1 340,260 352.5,313.1 365,372.5 382.5,466" fill="none" stroke="#e07b00" stroke-width="2.5" stroke-dasharray="8 5" stroke-linejoin="round"/>
  <text x="350" y="240" fill="#e07b00">y = 1 − x²</text>

  <!-- boundary line y = 2x (dashed: strict inequality) -->
  <line x1="65" y1="460" x2="295" y2="0" stroke="#2a6fdb" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="300" y="22" fill="#2a6fdb">y = 2x</text>

  <!-- intersection points (open: not part of the solution) -->
  <g fill="#ffffff" stroke="#333333" stroke-width="2">
    <circle cx="260.7" cy="68.6" r="5"/>
    <circle cx="119.3" cy="351.4" r="5"/>
  </g>
  <line x1="265" y1="73" x2="288" y2="88" stroke="#777777" stroke-width="1"/>
  <g fill="#333333" font-weight="bold" font-size="12" stroke="#ffffff" stroke-width="4" paint-order="stroke">
    <text x="290" y="98">(√2 − 1, 2√2 − 2)</text>
    <text x="128" y="372">(−1 − √2, −2 − 2√2)</text>
  </g>

  <text x="140" y="450" fill="#2e9e5b" font-size="12">shaded: x² + y &lt; 1 and y &gt; 2x</text>
</svg>
